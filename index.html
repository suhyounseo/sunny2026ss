<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="naver-site-verification" content="d55458adefe31207d774288e8aa3e173abbb3182" />
  <title>NICE SHOWROOM</title>
  <meta name="description" content="NICE 쇼룸. 파티룩, 무대의상, 클럽룩을 사진 기준으로 편하게 고르고 상품코드로 재고와 사이즈를 빠르게 확인하세요." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="NICE 동대문 쇼룸" />
  <meta property="og:title" content="동대문 파티의상·무대의상 NICE 쇼룸" />
  <meta property="og:description" content="동대문 밀리오레 NICE 온라인 쇼룸. 파티의상, 무대의상, 방송의상, 섹시드레스, 클럽룩, 홀복 스타일을 확인하세요." />
  <meta property="og:url" content="https://suhyounseo.github.io/sunny2026ss/" />
  <link rel="canonical" href="https://suhyounseo.github.io/sunny2026ss/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="stylesheet" href="style.css?v=match129" />
</head>
<body>
  <header class="hero">
    <img class="hero-image" src="assets/hero-nice-collection.jpg" alt="NICE COLLECTION Party look Stage outfit Club look" />
  </header>

  <main class="wrap">
    <div class="sticky-tools">
      <div class="top">
        <input id="q" class="search" placeholder="미니, 슬림핏, 파티룩, 무대의상 검색" />
      </div>
      <div id="quick" class="quick"></div>
      <div id="chips" class="chips"></div>
    </div>

    <div class="head">
      <h2 id="title">NICE COLLECTION</h2>
      <div id="count" class="count"></div>
    </div>

    <p id="intro" class="intro"></p>
    <section id="grid" class="grid"></section>
  </main>

  <div id="modal" class="modal">
    <div class="panel">
      <div class="modal-top">
        <div class="brand">NICE COLLECTION</div>
        <button id="close" class="close" type="button">×</button>
      </div>
      <div id="detail"></div>
    </div>
  </div>

  <div id="vipModal" class="vip-modal">
    <div class="vip-panel">
      <div class="vip-top">
        <div>
          <span>VIP ONLY</span>
          <h2>VIP 인증</h2>
        </div>
        <button id="vipClose" class="close" type="button">×</button>
      </div>
      <p>VIP 고객님께만 특별 셀렉션을 보여드립니다.</p>
      <input id="vipCode" class="vip-input" type="password" autocomplete="one-time-code" placeholder="인증코드를 입력해 주세요" />
      <div id="vipMessage" class="vip-message"></div>
      <div class="vip-actions">
        <button id="vipCancel" type="button">취소</button>
        <button id="vipSubmit" type="button">인증하기</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=match129"></script>
</body>
</html>
