<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6J4LF4DF3X"></script>

    gtag('js', new Date());
    gtag('config', 'G-6J4LF4DF3X');

  <style>
    :root{
      --bg:#f4eee8;
      --paper:#fbf7f3;
      --card:#fffaf6;
      --line:#e6d8cb;
      --line-2:#d6c4b4;
      --text:#241b16;
      --sub:#7d6859;
      --accent:#17110e;
      --gold:#c6a27a;
      --gold-2:#edd9c1;
      --shadow:0 14px 36px rgba(25,16,11,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR','Apple SD Gothic Neo',sans-serif}
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    img{display:block;max-width:100%}

    .hero{
      background:radial-gradient(circle at top,#3d2a20 0%, #1a120e 38%, #0f0a08 100%);
      color:#fff;
      text-align:center;
      padding:54px 20px 42px;
      border-bottom:1px solid #2b2019;
    }
    .hero h1{
      margin:0;
      font-family:Georgia,'Times New Roman',serif;
      font-size:64px;
      font-weight:700;
      letter-spacing:.16em;
      line-height:1;
    }
    .hero p{
      margin:16px 0 0;
      color:#e7d6c6;
      font-size:18px;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .wrap{max-width:1280px;margin:0 auto;padding:20px 14px 80px}
    .searchbar{
      width:100%;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:18px 22px;
      font-size:18px;outline:none;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.03)
    }
    .searchbar::placeholder{color:#9a8777}
    .chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 26px}
    .chip{
      border:1px solid var(--line-2);background:rgba(255,255,255,.8);color:#4a3d34;padding:12px 18px;border-radius:999px;
      cursor:pointer;transition:.18s ease;white-space:nowrap
    }
    .chip:hover{transform:translateY(-1px);border-color:#bda28b}
    .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

    .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 2px 20px}
    .section-head h2{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:46px;font-weight:600;letter-spacing:.04em}
    .section-head .count{color:var(--sub);font-size:17px}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    @media(min-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
    @media(min-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}}

    .card{
      background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(25,16,11,.12)}
    .photo{position:relative;aspect-ratio:3/4;background:#eadfd5}
    .photo img{width:100%;height:100%;object-fit:cover}
    .badges{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
    .badge{
      border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.02em;
      background:rgba(23,17,14,.82);color:#fff;backdrop-filter:blur(10px)
    }
    .badge.gold{background:linear-gradient(135deg,#dec1a2,#b58a60);color:#fff}
    .badge.light{background:rgba(255,250,246,.94);color:#4b3d34;border:1px solid rgba(145,118,94,.18)}
    .code{
      position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.95);color:#3f322a;border-radius:999px;padding:9px 14px;
      font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.08)
    }
    .info{padding:14px 14px 16px}
    .name{font-size:18px;line-height:1.45;font-weight:800;min-height:52px}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .meta span{
      font-size:12px;color:#816c5e;background:#f0e6dd;border:1px solid #e4d5c7;border-radius:999px;padding:6px 10px
    }
    .price{margin-top:14px;font-size:31px;font-weight:900;letter-spacing:-.02em;color:#18110d}

    .empty{padding:50px 20px;text-align:center;color:var(--sub);background:var(--paper);border:1px dashed var(--line-2);border-radius:22px}

    .detail{position:fixed;inset:0;background:rgba(18,11,9,.52);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}
    .detail.open{display:flex}
    .panel{
      width:min(1180px,100%);max-height:min(92vh,100%);overflow:auto;background:var(--paper);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.28)
    }
    .dtop{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:rgba(251,247,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .brand-mini{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:.12em;font-weight:700}
    .close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);background:#fff;cursor:pointer;font-size:20px}
    .dbody{display:grid;grid-template-columns:1.08fr .92fr;gap:0}
    @media(max-width:980px){.dbody{grid-template-columns:1fr}}
    .visual{padding:22px;background:#efe6dd}
    .main{
      aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#e9ddd1;box-shadow:0 10px 28px rgba(0,0,0,.08)
    }
    .main img{width:100%;height:100%;object-fit:cover}
    .thumbs{display:flex;gap:10px;overflow:auto;padding-top:14px}
    .thumb{flex:0 0 82px;height:108px;border-radius:14px;overflow:hidden;border:2px solid transparent;background:#fff;cursor:pointer;padding:0}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .thumb.on{border-color:#2f221b;box-shadow:0 6px 18px rgba(0,0,0,.12)}
    .copy{padding:28px 26px 28px;background:var(--paper)}
    .mini-cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .mini-cats span{padding:8px 12px;border-radius:999px;background:#f1e6db;border:1px solid #e4d5c8;font-size:12px;font-weight:700;color:#6b584b}
    .copy h2{margin:0 0 8px;font-size:44px;line-height:1.16;letter-spacing:-.03em}
    .copy h3{margin:0 0 20px;font-size:40px;letter-spacing:-.03em}
    .story,.note,.scene{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin-top:14px}
    .story b,.note b,.scene b{display:block;margin-bottom:10px;font-size:13px;letter-spacing:.12em;color:#8a7058}
    .points{margin:0;padding-left:18px;color:#4c3d33;line-height:1.75;font-size:17px}
    .story p,.scene p,.note p{margin:0;color:#4c3d33;line-height:1.8;font-size:17px}
    .spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
    @media(max-width:520px){.spec{grid-template-columns:1fr 1fr}}
    .spec .cell{background:#efe4d8;border:1px solid #e1cfbf;border-radius:18px;padding:16px}
    .spec .cell b{display:block;font-size:12px;letter-spacing:.12em;color:#8a7058;margin-bottom:8px}
    .spec .cell span{font-size:18px;font-weight:700;color:#2c211b}
    .cta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    @media(max-width:520px){.cta{grid-template-columns:1fr}}
    .cta a{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px;border-radius:18px;font-weight:900;font-size:19px}
    .cta .kakao{background:#ffe100;color:#221d00}
    .cta .insta{background:#15100d;color:#fff}
    .logo-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px}
    .kakao-logo{font-size:11px;font-weight:900;border-radius:9px;background:#3d3100;color:#ffe100;width:auto;padding:4px 6px;line-height:1}
    .insta svg{width:24px;height:24px;stroke:currentColor}

    @media(max-width:720px){
      .hero{padding:42px 16px 32px}
      .hero h1{font-size:54px}
      .hero p{font-size:14px;letter-spacing:.12em}
      .searchbar{font-size:16px;padding:16px 18px}
      .section-head h2{font-size:34px}
      .name{font-size:16px;min-height:46px}
      .price{font-size:24px}
      .copy{padding:22px 18px 24px}
      .copy h2{font-size:34px}
      .copy h3{font-size:32px}
      .story p,.scene p,.note p,.points{font-size:15px}
      .thumb{flex-basis:72px;height:96px}
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>NICE</h1>
    <p>Luxury Evening Edit</p>
  </header>

  <main class="wrap">
    <input id="q" class="searchbar" placeholder="검색: 상품명, 컬러, 카테고리" />
    <div id="chips" class="chips"></div>

    <div class="section-head">
      <h2>Collection</h2>
      <div id="count" class="count"></div>
    </div>

    <section id="grid" class="grid"></section>
  </main>

  <div id="detail" class="detail" aria-hidden="true">
    <div class="panel">
      <div class="dtop">
        <div class="brand-mini">NICE COLLECTION</div>
        <button type="button" class="close" id="closeBtn">✕</button>
      </div>
      <div id="panelBody"></div>
    </div>
  </div>

  <script>
    const qs = (s, el=document)=>el.querySelector(s);
    const qsa = (s, el=document)=>[...el.querySelectorAll(s)];
    const q = qs('#q');
    const chips = qs('#chips');
    const grid = qs('#grid');
    const count = qs('#count');
    const detail = qs('#detail');
    const panelBody = qs('#panelBody');
    const closeBtn = qs('#closeBtn');

    let PRODUCTS = [];
    let FILTER = 'ALL';
    let currentImages = [];

    const FILTERS = [
      ['ALL','전체'],
      ['BEST','🔥 BEST'],
      ['NEW','✨ NEW'],
      ['RECOMMEND','EDITOR’S PICK'],
      ['LUXURY','LUXURY'],
      ['COSTUME','COSTUME'],
      ['TWO PIECE','투피스'],
      ['PARTY','PARTY'],
      ['MINI','MINI'],
      ['MIDI','MIDI'],
      ['LONG','LONG'],
      ['TOP','상의'],
      ['SKIRT','스커트']
    ];

    const money = n => n ? '₩' + Number(n).toLocaleString('ko-KR') : '문의';
    function track(name, params={}){ try{ gtag('event', name, params); }catch(e){} }

    function normalize(text){ return String(text || '').toLowerCase(); }

    function matchesFilter(item){
      const search = normalize(q.value.trim());
      const hay = normalize([
        item.code, item.name, item.storeName, item.origin, item.folder, item.supplier, item.color, item.category, ...(item.tags||[])
      ].join(' '));

      const searchOk = !search || hay.includes(search);
      const tags = item.tags || [];
      const filterOk = FILTER === 'ALL'
        || (FILTER === 'BEST' && (item.best || tags.includes('BEST')))
        || (FILTER === 'NEW' && (item.new || tags.includes('NEW')))
        || tags.includes(FILTER)
        || item.category === FILTER;
      return searchOk && filterOk;
    }

    function makePromoBadges(item){
      const tags = item.tags || [];
      const out = [];
      if(item.best || tags.includes('BEST')) out.push('<span class="badge">BEST</span>');
      if(item.new || tags.includes('NEW')) out.push('<span class="badge gold">NEW</span>');
      if(tags.includes('RECOMMEND')) out.push('<span class="badge light">EDITOR’S PICK</span>');
      if(!out.length) out.push(`<span class="badge">${item.category || 'NICE'}</span>`);
      return out.join('');
    }

    function smallMeta(item){
      const tags = [];
      if(item.category) tags.push(item.category);
      if(item.color) tags.push(item.color);
      if(item.size) tags.push('SIZE ' + item.size);
      return tags.slice(0,3).map(v=>`<span>${v}</span>`).join('');
    }

    function sellingPoints(item){
      const pts = [];
      const name = item.name || '';
      const cat = item.category || '';
      const color = item.color || '';

      if(cat === 'TWO PIECE') pts.push('상하의 밸런스가 좋아 허리선은 더욱 슬림해 보이고 비율은 길어 보이는 실루엣입니다.');
      else if(cat === 'MINI') pts.push('다리 라인을 더욱 길고 슬림하게 보여 주는 미니 기장으로 존재감 있는 스타일을 완성합니다.');
      else if(cat === 'MIDI') pts.push('부담 없이 세련된 분위기를 연출하는 미디 기장으로 우아함과 여성스러움을 동시에 살려줍니다.');
      else if(cat === 'LONG') pts.push('움직일 때마다 흐르는 실루엣이 고급스럽게 살아나는 롱 라인으로 특별한 자리에서 더 돋보입니다.');
      else if(cat === 'TOP') pts.push('단독으로도 포인트가 살아나고 다양한 하의와 함께 스타일링하기 좋은 활용도 높은 디자인입니다.');
      else if(cat === 'SKIRT') pts.push('하체 라인을 정돈해 주면서도 여성스러운 분위기를 살려 주는 세련된 실루엣입니다.');
      else pts.push('라인감이 돋보여 몸매를 더욱 정리해 보이게 하고 사진에서도 존재감 있게 표현되는 스타일입니다.');

      if(/러플|프릴|셔링|드레이프|플리츠|주름/.test(name)) pts.push('디테일 포인트가 얼굴빛과 전체 분위기를 한층 더 화사하고 입체적으로 보이게 해줍니다.');
      else if(/오프숄더|튜브|홀터|브이넥/.test(name)) pts.push('넥라인이 예쁘게 드러나 답답해 보이지 않고 여리여리한 무드를 더해줍니다.');
      else pts.push('군더더기 없이 떨어지는 라인 덕분에 고급스럽고 세련된 분위기를 자연스럽게 완성해 줍니다.');

      if(color) pts.push(`${color} 컬러 특유의 분위기가 고급스럽게 살아나 파티, 모임, 촬영 등 시선을 끌고 싶은 순간에 특히 잘 어울립니다.`);
      else pts.push('실제 착용 시에도 사진처럼 분위기가 살아나 특별한 자리에서 자연스럽게 시선을 사로잡을 수 있습니다.');

      return pts.slice(0,3);
    }

    function sceneText(item){
      return item.recommend
        ? item.recommend.replaceAll('/', ' · ')
        : '파티 · 모임 · 데이트 · 촬영 · 특별한 약속';
    }

    function styleNote(item){
      const size = item.size || 'FREE';
      const stretch = item.stretch || '확인 필요';
      return `${item.name}는 단독으로도 포인트가 충분한 디자인이라 별다른 스타일링 없이도 완성도 높은 룩을 연출할 수 있습니다. 사이즈는 ${size} 구성이며, 착용감은 ${stretch} 기준입니다.`;
    }

    function render(){
      const list = PRODUCTS.filter(matchesFilter);
      count.textContent = `${list.length} items`;

      if(!list.length){
        grid.innerHTML = '<div class="empty">조건에 맞는 상품이 없습니다. 다른 검색어나 카테고리를 선택해 보세요.</div>';
        return;
      }

      grid.innerHTML = list.map(item => `
        <article class="card" data-code="${item.code}">
          <div class="photo">
            ${item.images?.[0] ? `<img loading="lazy" src="${item.images[0]}?v=match9" alt="${item.name}">` : ''}
            <div class="badges">${makePromoBadges(item)}</div>
            <span class="code">${item.code}</span>
          </div>
          <div class="info">
            <div class="name">${item.name}</div>
            <div class="meta">${smallMeta(item)}</div>
            <div class="price">${money(item.price)}</div>
          </div>
        </article>
      `).join('');

      qsa('.card').forEach(card => {
        card.addEventListener('click', () => openDetail(card.dataset.code));
      });
    }

    function setImage(index){
      const main = qs('#mainImage');
      const target = currentImages[index];
      if(!main || !target) return;
      main.src = `${target.url}?v=match9`;
      qsa('.thumb', detail).forEach((thumb, i) => thumb.classList.toggle('on', i === index));
    }

    function openDetail(code){
      const item = PRODUCTS.find(p => p.code === code);
      if(!item) return;
      currentImages = item.cuts?.length ? item.cuts : (item.images || []).map((url, i) => ({url, cut:'컷'+(i+1), source:url}));
      const tags = item.tags || [];
      const labelTags = [];
      if(item.best || tags.includes('BEST')) labelTags.push('BEST');
      if(item.new || tags.includes('NEW')) labelTags.push('NEW');
      if(tags.includes('RECOMMEND')) labelTags.push('EDITOR’S PICK');
      if(item.category) labelTags.push(item.category);
      if(item.color) labelTags.push(item.color);

      track('product_view', {product_code:item.code, product_name:item.name, category:item.category, price:item.price});

      panelBody.innerHTML = `
        <div class="dbody">
          <section class="visual">
            <div class="main">${currentImages[0] ? `<img id="mainImage" src="${currentImages[0].url}?v=match9" alt="${item.name}">` : 'NO IMAGE'}</div>
            <div class="thumbs">
              ${currentImages.map((im, i) => `
                <button type="button" class="thumb ${i===0?'on':''}" data-index="${i}" aria-label="thumbnail ${i+1}">
                  <img src="${im.url}?v=match9" alt="${item.name} ${i+1}">
                </button>
              `).join('')}
            </div>
          </section>
          <section class="copy">
            <div class="mini-cats">${labelTags.map(v => `<span>${v}</span>`).join('')}</div>
            <h2>${item.name}</h2>
            <h3>${money(item.price)}</h3>

            <div class="story">
              <b>WHY YOU’LL LOVE IT</b>
              <ul class="points">${sellingPoints(item).map(p => `<li>${p}</li>`).join('')}</ul>
            </div>

            <div class="scene">
              <b>EDITOR’S NOTE</b>
              <p>${styleNote(item)}</p>
            </div>

            <div class="note">
              <b>RECOMMENDED FOR</b>
              <p>${sceneText(item)}</p>
            </div>

            <div class="spec">
              <div class="cell"><b>COLOR</b><span>${item.color || '-'}</span></div>
              <div class="cell"><b>SIZE</b><span>${item.size || '-'}</span></div>
              <div class="cell"><b>FIT</b><span>${item.stretch || '-'}</span></div>
              <div class="cell"><b>LINING</b><span>${item.lining || '-'}</span></div>
            </div>

            <div class="cta">
              <a class="kakao" href="http://qr.kakao.com/talk/aGDd1dyfDwbjsvFXshqsTJhGWWc-" target="_blank" rel="noopener">
                <span class="logo-icon kakao-logo">TALK</span><span>카카오톡 문의</span>
              </a>
              <a class="insta" href="https://www.instagram.com/dongdaemun_helloapm_nice?igsh=am16YjFmdHdtajN6" target="_blank" rel="noopener">
                <span class="logo-icon insta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"></circle></svg></span>
                <span>인스타 DM</span>
              </a>
            </div>
          </section>
        </div>
      `;

      detail.classList.add('open');
      detail.setAttribute('aria-hidden','false');
      history.pushState({detail: code}, '', '#' + code);

      qsa('.thumb', detail).forEach(btn => {
        btn.addEventListener('click', () => setImage(Number(btn.dataset.index)));
      });
    }

    function closeDetail(fromPop=false){
      detail.classList.remove('open');
      detail.setAttribute('aria-hidden','true');
      if(!fromPop && location.hash){
        history.pushState({}, '', location.pathname);
      }
    }

    async function init(){
      PRODUCTS = await (await fetch('./products.json?v=match9')).json();
      chips.innerHTML = FILTERS.map(([key, label]) => `
        <button type="button" class="chip ${key==='ALL' ? 'on' : ''}" data-filter="${key}">${label}</button>
