<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NICE COLLECTION</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#f7f1eb;--card:#fffaf5;--ink:#15110e;--muted:#8c7d70;--gold:#b99162;--line:#eadfd4;--dark:#181411}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}button,input{font:inherit}.hero{background:radial-gradient(circle at 70% 20%,#4a3427 0,#181411 45%,#0e0c0a 100%);color:#fff;padding:38px 18px 30px;text-align:center}.eyebrow{letter-spacing:.42em;color:var(--gold);font-size:11px;margin-bottom:12px}.brand{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,11vw,82px);letter-spacing:.14em;font-weight:500;line-height:.95}.tagline{margin-top:12px;color:#d7c7b7;font-size:13px;letter-spacing:.12em}.hero-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.hero-actions a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:10px 16px;border-radius:999px;font-size:12px;letter-spacing:.08em;background:rgba(255,255,255,.06)}.toolbar{position:sticky;top:0;z-index:30;background:rgba(247,241,235,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 12px 10px}.search{max-width:980px;margin:0 auto 10px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px;outline:none;box-shadow:0 6px 18px rgba(0,0,0,.035)}.chips{max-width:980px;margin:0 auto;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fffaf5;color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:12px;cursor:pointer}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}.wrap{max-width:1120px;margin:0 auto;padding:26px 12px 90px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 4px 18px}.section-title{font-family:'Cormorant Garamond',serif;font-size:30px;letter-spacing:.08em}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:var(--card);border:1px solid rgba(234,223,212,.8);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(38,25,15,.06);cursor:pointer;transition:.22s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(38,25,15,.12)}.photo{aspect-ratio:3/4;background:linear-gradient(135deg,#eadfd4,#fffaf5);position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .empty{position:absolute;inset:0;display:grid;place-items:center;color:#bca790;font-size:12px;text-align:center;padding:20px}.badge{position:absolute;top:10px;left:10px;background:rgba(20,16,13,.88);color:#fff;font-size:10px;letter-spacing:.1em;padding:5px 8px;border-radius:999px}.price-pill{position:absolute;right:10px;bottom:10px;background:rgba(255,250,245,.92);backdrop-filter:blur(6px);padding:6px 9px;border-radius:999px;font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--dark)}.info{padding:12px 12px 14px}.name{font-weight:600;font-size:14px;line-height:1.38;min-height:38px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:11px}.meta span{background:#f0e7df;border-radius:999px;padding:4px 7px}.detail{position:fixed;inset:0;background:rgba(15,11,8,.72);z-index:100;display:none;overflow:auto}.detail.open{display:block}.panel{max-width:940px;margin:0 auto;background:#fffaf5;min-height:100vh}@media(min-width:900px){.panel{margin:34px auto;border-radius:24px;overflow:hidden;min-height:auto}}.topbar{position:sticky;top:0;background:rgba(255,250,245,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:3}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}.detail-body{display:grid;grid-template-columns:1fr}@media(min-width:760px){.detail-body{grid-template-columns:1.05fr .95fr}}.gallery{background:#eee2d8}.main-img{aspect-ratio:3/4;background:#eee2d8}.main-img img{width:100%;height:100%;object-fit:cover;display:block}.dinfo{padding:28px 22px}.dcat{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}.dname{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.08;margin-bottom:10px}.dprice{font-family:'Cormorant Garamond',serif;font-size:30px;margin:14px 0 20px}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}.spec{background:#f3ebe3;border-radius:12px;padding:11px}.spec b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.desc{line-height:1.75;color:#5c5149;background:#fff;border-left:3px solid var(--gold);padding:14px;border-radius:12px}.cta{display:grid;gap:9px;margin-top:20px}.cta a{text-align:center;text-decoration:none;border-radius:14px;padding:13px 15px}.kakao{background:#fee500;color:#1b1b1b}.insta{background:#181411;color:#fff}.store{border:1px solid var(--line);color:var(--ink);background:#fff}.footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 20px}</style>
<style>
.thumbs{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#eadfd4}.thumb{width:64px;height:84px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#fff;flex:0 0 auto;cursor:pointer;opacity:.65}.thumb.on{border-color:#181411;opacity:1}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.pointbox{background:#fff;border-left:3px solid #b99162;padding:16px;border-radius:14px;margin-bottom:16px}.point-title{font-weight:800;margin-bottom:10px;font-size:15px}.points{margin:0;padding-left:18px;color:#4e453e;line-height:1.7;font-size:14px}.points li{margin-bottom:5px}.recommend{background:#f3ebe3;border-radius:12px;padding:12px 14px;color:#5c5149;font-size:13px;margin-bottom:16px}.spec.soft{opacity:.78}
</style>
</head><body><header class="hero"><div class="eyebrow">CURATED DRESS COLLECTION</div><div class="brand">NICE</div><div class="tagline">Confidence in Every Look · Party · Stage · Two Piece</div><div class="hero-actions"><a href="https://www.instagram.com/" target="_blank">INSTAGRAM DM</a><a href="https://pf.kakao.com/" target="_blank">KAKAO INQUIRY</a><a href="#products">VIEW COLLECTION</a></div></header><nav class="toolbar"><div class="search"><input id="q" placeholder="검색: 블랙, 화이트, 미니, 투피스, 파티룩" oninput="render()"></div><div class="chips" id="chips"></div></nav><main class="wrap" id="products"><div class="section-head"><div><div class="section-title">New Collection</div><div class="count" id="count"></div></div></div><div class="grid" id="grid"></div></main><div class="detail" id="detail" onclick="if(event.target.id==='detail')closeDetail()"><div class="panel" id="panel"></div></div><footer class="footer">NICE COLLECTION · 온라인 쇼룸 1차 런칭 버전</footer><script>let PRODUCTS=[],currentCat='ALL',currentImages=[];const cats=[['ALL','전체'],['BEST','BEST'],['TWO PIECE','투피스'],['MINI','미니'],['MIDI','미디'],['LONG','롱'],['TOP','상의'],['SKIRT','스커트']];const money=n=>n?`₩${Number(n).toLocaleString('ko-KR')}`:'문의';async function load(){PRODUCTS=await(await fetch('./products.json')).json();makeChips();render()}function makeChips(){chips.innerHTML=cats.map(([k,v])=>`<button class="chip ${k==='ALL'?'on':''}" onclick="currentCat='${k}';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');render()">${v}</button>`).join('')}function match(p){const q=document.getElementById('q').value.trim().toLowerCase();const text=[p.name,p.category,p.color,p.code,p.origin,p.desc].join(' ').toLowerCase();return(!q||text.includes(q))&&(currentCat==='ALL'||(currentCat==='BEST'?p.best:p.category===currentCat))}function render(){const list=PRODUCTS.filter(match);count.textContent=`${list.length} items`;grid.innerHTML=list.map(p=>`<article class="card" onclick="openDetail('${p.code}')"><div class="photo">${p.images&&p.images[0]?`<img loading="lazy" decoding="async" src="${p.images[0]}" alt="${p.name}">`:`<div class="empty">IMAGE<br>COMING SOON</div>`}${p.best?'<span class="badge">BEST</span>':''}<span class="price-pill">${money(p.price)}</span></div><div class="info"><div class="name">${p.name}</div><div class="meta"><span>${p.category}</span>${p.color?`<span>${p.color}</span>`:''}</div></div></article>`).join('')}function setMainImage(i){const main=document.getElementById('mainProductImage'); if(!main||!currentImages[i])return; main.src=currentImages[i]; document.querySelectorAll('.thumb').forEach((t,idx)=>t.classList.toggle('on',idx===i));}
function openDetail(code){const p=PRODUCTS.find(x=>x.code===code);if(!p)return;const imgs=p.images||[];currentImages=imgs;const thumbs=imgs.length>1?`<div class="thumbs">${imgs.map((src,i)=>`<button class="thumb ${i===0?'on':''}" onclick="setMainImage(${i})"><img src="${src}" alt="${p.name} ${i+1}"></button>`).join('')}</div>`:'';const pointList=(p.points&&p.points.length?p.points:[p.desc||p.name]).map(x=>`<li>${x}</li>`).join('');panel.innerHTML=`<div class="topbar"><button class="close" onclick="closeDetail()">✕</button><span>${p.code} · ${p.category}</span></div><div class="detail-body"><div class="gallery"><div class="main-img">${imgs[0]?`<img id="mainProductImage" src="${imgs[0]}" alt="${p.name}">`:'<div class="empty">IMAGE COMING SOON</div>'}</div>${thumbs}</div><div class="dinfo"><div class="dcat">${p.category}</div><div class="dname">${p.name}</div><div class="dprice">${money(p.price)}</div><div class="pointbox"><div class="point-title">이 옷의 포인트</div><ul class="points">${pointList}</ul></div><div class="recommend">${p.recommend||'추천 상황: 클럽 · 파티 · 방송 · 촬영 · 행사룩'}</div><div class="specs"><div class="spec"><b>COLOR</b>${p.color||'-'}</div><div class="spec"><b>SIZE</b>${p.size||'S / M / L'}</div><div class="spec"><b>FIT</b>${p.stretch||'-'}</div><div class="spec"><b>SEE THROUGH</b>${p.see||'-'}</div><div class="spec soft"><b>FABRIC</b>${p.fabric||'-'}</div><div class="spec soft"><b>LINING</b>${p.lining||'-'}</div></div><div class="cta"><a class="kakao" href="https://pf.kakao.com/" target="_blank">카카오톡 문의하기</a><a class="insta" href="https://www.instagram.com/" target="_blank">인스타 DM 문의</a><a class="store" href="#" onclick="alert('스마트스토어 연결 예정입니다')">스마트스토어 준비중</a></div></div></div>`;detail.classList.add('open');document.body.style.overflow='hidden'}function closeDetail(){detail.classList.remove('open');document.body.style.overflow=''}load();</script></body></html>
