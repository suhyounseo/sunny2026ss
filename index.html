<script async src="https://www.googletagmanager.com/gtag/js?id=G-6J4LF4DF3X"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-6J4LF4DF3X');</script>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f1eb;color:#17120f;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.hero{background:#181411;color:white;text-align:center;padding:30px 16px}.hero h1{font-size:42px;letter-spacing:.12em;margin:0}.hero p{color:#d8c8b8}.bar{position:sticky;top:0;background:rgba(247,241,235,.96);z-index:10;border-bottom:1px solid #eadfd4;padding:10px}.search{max-width:1120px;margin:0 auto 8px}.search input{width:100%;padding:12px 16px;border:1px solid #eadfd4;border-radius:999px}.chips{max-width:1120px;margin:auto;display:flex;gap:7px;overflow:auto}.chip{border:1px solid #eadfd4;background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;cursor:pointer}.chip.on{background:#181411;color:#fff}.wrap{max-width:1200px;margin:auto;padding:18px 12px 60px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #eadfd4;border-radius:14px;padding:12px}.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:#7d7066}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}.head{display:flex;justify-content:space-between;align-items:end;margin:10px 2px 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:#fffaf7;border:1px solid #eadfd4;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 8px 20px #0000000d}.photo{aspect-ratio:3/4;background:#eee2d8;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge,.code{position:absolute;background:#000b;color:white;border-radius:999px;padding:4px 8px;font-size:11px}.badge{top:8px;left:8px}.code{right:8px;bottom:8px;background:#ffffffe6;color:#111;font-weight:800}.info{padding:12px}.name{font-weight:800;line-height:1.35;min-height:40px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.meta span{font-size:11px;background:#f0e7df;border-radius:999px;padding:4px 7px;color:#665b53}.price{font-weight:900;margin-top:8px}.detail{display:none;position:fixed;inset:0;background:#0009;z-index:100;overflow:auto}.detail.open{display:block}.panel{background:#fffaf7;max-width:1040px;margin:0 auto;min-height:100vh}.top{position:sticky;top:0;background:#fffaf7ee;border-bottom:1px solid #eadfd4;padding:10px;display:flex;gap:10px;align-items:center}.close{width:38px;height:38px;border-radius:50%;border:1px solid #eadfd4;background:#fff}.body{display:grid}@media(min-width:800px){.body{grid-template-columns:1.05fr .95fr}}.main{aspect-ratio:3/4;background:#eadfd4}.main img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:8px;background:#eadfd4;padding:10px;overflow:auto}.thumb{width:70px;height:92px;border:2px solid transparent;border-radius:10px;overflow:hidden;flex:0 0 auto;position:relative;background:#fff}.thumb.on{border-color:#181411}.thumb img{width:100%;height:100%;object-fit:cover}.thumb small{position:absolute;left:2px;right:2px;bottom:2px;background:#0009;color:white;font-size:9px;border-radius:5px}.dinfo{padding:22px}.dinfo h2{font-size:30px;margin:8px 0}.box{background:#fff;border-left:3px solid #b99162;padding:13px;border-radius:12px;line-height:1.65;margin:12px 0}.spec{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.spec div{background:#f2e9e1;border-radius:12px;padding:10px;font-size:13px}.spec b{display:block;font-size:11px;color:#817367}.cta{display:grid;gap:8px;margin-top:15px}.cta a{text-align:center;text-decoration:none;border-radius:12px;padding:12px;font-weight:800}.kakao{background:#fee500;color:#111}.insta{background:#181411;color:white}.src{font-size:11px;color:#83766c;word-break:break-all;margin-top:10px}</style></head><body>
<header class="hero"><h1>NICE</h1><p>Cloudinary 폴더 기준 온라인 매칭 검수용</p></header><nav class="bar"><div class="search"><input id="q" placeholder="검색: 상품코드, 상품명, 원본폴더, 색상, 거래처"></div><div class="chips" id="chips"></div></nav><main class="wrap"><div class="kpis" id="kpis"></div><div class="head"><h2>Match Preview</h2><div id="count"></div></div><div class="grid" id="grid"></div></main><div class="detail" id="detail"><div class="panel" id="panel"></div></div>
<script>
let P=[],F='ALL',imgs=[];const filters=[['ALL','전체'],['BEST','🔥 BEST'],['NEW','✨ NEW'],['RECOMMEND','추천'],['LUXURY','LUXURY'],['COSTUME','COSTUME'],['TWO PIECE','투피스'],['MINI','미니'],['MIDI','미디'],['LONG','롱'],['TOP','상의'],['SKIRT','스커트'],['NOIMG','이미지없음']];const money=n=>n?'₩'+Number(n).toLocaleString('ko-KR'):'문의';function tr(n,p){try{gtag('event',n,p||{})}catch(e){}}async function init(){P=await(await fetch('./products.json?v=match3')).json();chips.innerHTML=filters.map(x=>`<button type="button" class="chip ${x[0]=='ALL'?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('');chips.onclick=e=>{let b=e.target.closest('button');if(!b)return;F=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b));tr('category_click',{category:F});render()};q.oninput=()=>{if(q.value.trim().length>=2)tr('product_search',{search_term:q.value.trim()});render()};kpis.innerHTML=`<div class=kpi><b>${P.length}</b><span>매칭상품</span></div><div class=kpi><b>${P.reduce((a,p)=>a+(p.images||[]).length,0)}</b><span>연결이미지</span></div><div class=kpi><b>${P.filter(p=>(p.images||[]).length).length}</b><span>이미지 있음</span></div><div class=kpi><b>${P.filter(p=>(p.images||[]).length==0).length}</b><span>이미지 없음</span></div>`;render()}function ok(p){let s=[p.code,p.name,p.storeName,p.origin,p.folder,p.supplier,p.color,p.category,(p.tags||[]).join(' ')].join(' ').toLowerCase(),v=q.value.trim().toLowerCase();return(!v||s.includes(v))&&(F=='ALL'||(F=='NOIMG'&&!(p.images||[]).length)||(p.tags||[]).includes(F)||p.category==F)}function render(){let L=P.filter(ok);count.innerHTML=L.length+' items / '+F;grid.innerHTML=L.map(p=>`<article class=card data-code="${p.code}"><div class=photo>${p.images?.[0]?`<img loading=lazy src="${p.images[0]}?v=match3">`:'NO IMAGE'}<span class=badge>${p.category}</span><span class=code>${p.code}</span></div><div class=info><div class=name>${p.name}</div><div class=meta><span>${p.supplier}</span><span>${p.origin||p.folder}</span><span>${p.color||''}</span></div><div class=price>${money(p.price)}</div></div></article>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openD(c.dataset.code))}function setI(i){let im=imgs[i];main.src=im.url;document.querySelectorAll('.thumb').forEach((t,j)=>t.classList.toggle('on',i==j));src.textContent=im.cut+' · '+im.source}function openD(code){let p=P.find(x=>x.code==code);imgs=p.cuts?.length?p.cuts:(p.images||[]).map((u,i)=>({url:u,cut:'컷'+(i+1),source:u}));tr('product_view',{product_code:p.code,product_name:p.name,category:p.category,price:p.price});panel.innerHTML=`<div class=top><button type="button" class=close>✕</button><b>${p.code}</b><span>${p.supplier} / ${p.folder}</span></div><div class=body><div><div class=main>${imgs[0]?`<img id=main src="${imgs[0].url}?v=match3">`:'NO IMAGE'}</div><div class=thumbs>${imgs.map((im,i)=>`<button type="button" class="thumb ${i==0?'on':''}" data-i=${i}><img src="${im.url}?v=match3"><small>${im.cut}</small></button>`).join('')}</div></div><div class=dinfo><div>${p.category} · ${p.color||''}</div><h2>${p.name}</h2><h3>${money(p.price)}</h3><div class=box><b>검수 포인트</b><br>1. 같은 옷 사진끼리 묶였는지<br>2. 대표사진이 전면/전신인지<br>3. 제품컷/색상컷은 뒤쪽이면 정상</div><div class=spec><div><b>원본코드</b>${p.origin||'-'}</div><div><b>폴더</b>${p.zipFolder||'-'}</div><div><b>SIZE</b>${p.size||'-'}</div><div><b>이미지수</b>${(p.images||[]).length}</div></div><div class=box>${p.desc||''}</div><div class=cta><a class=kakao href="http://qr.kakao.com/talk/aGDd1dyfDwbjsvFXshqsTJhGWWc-" target=_blank>💬 카카오톡 문의</a><a class=insta href="https://www.instagram.com/dongdaemun_helloapm_nice?igsh=am16YjFmdHdtajN6" target=_blank>📷 Instagram DM</a></div><div class=src id=src>${imgs[0]?(imgs[0].cut+' · '+imgs[0].source):''}</div></div></div>`;detail.classList.add('open');history.pushState({d:code},'','#'+code);panel.querySelector('.close').onclick=()=>closeD();panel.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>setI(Number(t.dataset.i)))}function closeD(pop){detail.classList.remove('open');if(!pop&&location.hash)history.pushState('',document.title,location.pathname+location.search)}onpopstate=()=>{if(detail.classList.contains('open'))closeD(true)};detail.onclick=e=>{if(e.target.id=='detail')closeD()};init();
</script></body></html>
