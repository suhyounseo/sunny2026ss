<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICE COLLECTION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1eb;--card:#fffaf5;--ink:#15110e;--muted:#8c7d70;--gold:#b99162;--line:#eadfd4;--dark:#181411;--soft:#f0e7df;--white:#fffaf5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}button,input{font:inherit}.hero{background:radial-gradient(circle at 72% 18%,#5b3f2e 0,#1b1511 46%,#0d0b09 100%);color:#fff;padding:42px 18px 32px;text-align:center}.eyebrow{letter-spacing:.42em;color:var(--gold);font-size:11px;margin-bottom:12px}.brand{font-family:'Cormorant Garamond',serif;font-size:clamp(46px,11vw,88px);letter-spacing:.14em;font-weight:500;line-height:.95}.tagline{margin-top:14px;color:#d7c7b7;font-size:13px;letter-spacing:.1em;line-height:1.7}.hero-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.hero-actions a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:10px 16px;border-radius:999px;font-size:12px;letter-spacing:.08em;background:rgba(255,255,255,.06)}.toolbar{position:sticky;top:0;z-index:30;background:rgba(247,241,235,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 12px 10px}.search{max-width:1040px;margin:0 auto 10px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px;outline:none;box-shadow:0 6px 18px rgba(0,0,0,.035)}.chips{max-width:1040px;margin:0 auto;display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fffaf5;color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:12px;cursor:pointer}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}.wrap{max-width:1160px;margin:0 auto;padding:26px 12px 90px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 4px 18px}.section-title{font-family:'Cormorant Garamond',serif;font-size:32px;letter-spacing:.08em}.count{font-size:12px;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:var(--card);border:1px solid rgba(234,223,212,.8);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(38,25,15,.06);cursor:pointer;transition:.22s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(38,25,15,.12)}.photo{aspect-ratio:3/4;background:linear-gradient(135deg,#eadfd4,#fffaf5);position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .empty{position:absolute;inset:0;display:grid;place-items:center;color:#bca790;font-size:12px;text-align:center;padding:20px}.badge{position:absolute;top:10px;left:10px;background:rgba(20,16,13,.88);color:#fff;font-size:10px;letter-spacing:.1em;padding:5px 8px;border-radius:999px}.badge.new{left:auto;right:10px;background:rgba(185,145,98,.94)}.price-pill{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:7px 10px;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.02em;color:#181411;box-shadow:0 4px 14px rgba(0,0,0,.12)}.info{padding:12px 12px 14px}.name{font-weight:700;font-size:14px;line-height:1.38;min-height:38px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:11px}.meta span{background:#f0e7df;border-radius:999px;padding:4px 7px}.detail{position:fixed;inset:0;background:rgba(15,11,8,.72);z-index:100;display:none;overflow:auto}.detail.open{display:block}.panel{max-width:980px;margin:0 auto;background:#fffaf5;min-height:100vh}@media(min-width:900px){.panel{margin:34px auto;border-radius:24px;overflow:hidden;min-height:auto}}.topbar{position:sticky;top:0;background:rgba(255,250,245,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:3}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}.detail-body{display:grid;grid-template-columns:1fr}@media(min-width:780px){.detail-body{grid-template-columns:1.05fr .95fr}}.gallery{background:#eee2d8}.main-img{aspect-ratio:3/4;background:#eee2d8}.main-img img{width:100%;height:100%;object-fit:cover;display:block}.thumbs{display:flex;gap:8px;padding:12px;overflow-x:auto;background:#eadfd4}.thumb{width:64px;height:84px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#fff;flex:0 0 auto;cursor:pointer;opacity:.65}.thumb.on{border-color:var(--dark);opacity:1}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.dinfo{padding:28px 22px}.dcat{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}.dname{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.08;margin-bottom:10px}.dprice{font-family:'Noto Sans KR',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.03em;margin:14px 0 20px;color:#181411}.pointbox{background:#fff;border-left:3px solid var(--gold);padding:16px;border-radius:14px;margin-bottom:16px}.point-title{font-weight:800;margin-bottom:10px;font-size:15px}.points{margin:0;padding-left:18px;color:#4e453e;line-height:1.7;font-size:14px}.points li{margin-bottom:5px}.recommend{background:#f3ebe3;border-radius:12px;padding:12px 14px;color:#5c5149;font-size:13px;margin-bottom:16px}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.spec{background:#f3ebe3;border-radius:12px;padding:11px}.spec b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.spec.soft{opacity:.78}.cta{display:grid;gap:9px;margin-top:20px}.cta a{text-align:center;text-decoration:none;border-radius:14px;padding:13px 15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}.cta svg{width:20px;height:20px;flex:0 0 auto}.kakao{background:#fee500;color:#1b1b1b}.insta{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff}.store{border:1px solid var(--line);color:var(--ink);background:#fff}.admin{display:none;max-width:980px;margin:24px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:13px;color:#5c5149}.footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 20px}
</style>
</head>
<body>
<header class="hero"><div class="eyebrow">CURATED DRESS COLLECTION</div><div class="brand">NICE</div><div class="tagline">고급 섹시 원피스 · 파티룩 · 투피스 온라인 쇼룸</div><div class="hero-actions"><a href="#products" onclick="quick('BEST')">BEST 보기</a><a href="#products" onclick="quick('NEW')">NEW 보기</a><a href="#products" onclick="quick('ALL')">전체상품</a></div></header>
<nav class="toolbar"><div class="search"><input id="q" placeholder="검색: 블랙, 화이트, 미니, 롱, 투피스, 코스튬, 파티룩" oninput="render()"></div><div class="chips" id="chips"></div></nav>
<main class="wrap" id="products"><div class="section-head"><div><div class="section-title">New Collection</div><div class="count" id="count"></div></div></div><div class="grid" id="grid"></div><div class="admin" id="adminBox"></div></main>
<div class="detail" id="detail" onclick="if(event.target.id==='detail')closeDetail()"><div class="panel" id="panel"></div></div><footer class="footer">NICE COLLECTION · 온라인 쇼룸</footer>
<script>
let PRODUCTS=[],currentCat='ALL',currentImages=[],modalOpen=false;const INSTAGRAM_URL='https://www.instagram.com/dongdaemun_helloapm_nice?igsh=am16YjFmdHdtajN6';const KAKAO_URL='http://qr.kakao.com/talk/aGDd1dyfDwbjsvFXshqsTJhGWWc-';const cats=[['ALL','전체'],['BEST','🔥 BEST'],['NEW','✨ NEW'],['RECOMMEND','👑 추천'],['LUXURY','💎 LUXURY'],['COSTUME','🎭 COSTUME'],['TWO PIECE','👗 투피스'],['PARTY','🎉 PARTY'],['MINI','MINI'],['MIDI','MIDI'],['LONG','LONG'],['TOP','상의'],['SKIRT','스커트']];const money=n=>n?`₩${Number(n).toLocaleString('ko-KR')}`:'문의';const clean=s=>(s||'').toString();function categoryOf(p){const t=[p.category,p.name,p.origin,p.folder].join(' ');if(/투피스|TWO PIECE|3PS/i.test(t))return 'TWO PIECE';if(/블라우스|가디건|탑|BL|TOP|나시|뷔스티에/i.test(t))return 'TOP';if(/스커트|SK|하의/i.test(t))return 'SKIRT';if(/롱|LONG/i.test(t))return 'LONG';if(/미디|MIDI|H라인/i.test(t))return 'MIDI';if(/미니|MINI/i.test(t))return 'MINI';if(/DRESS|원피스|OPS/i.test(t))return 'MINI';return p.category||'ITEM'}function tagsOf(p){const t=[p.name,p.origin,p.folder,p.category,p.color,p.catch].join(' ');let tags=[];if(p.best)tags.push('BEST');if(Number((p.code||'').replace(/\D/g,''))>=260150)tags.push('NEW');if(/마린|세일러|스쿨|교복|코스튬/i.test(t))tags.push('COSTUME');if(/럭셔리|롱|주얼|트위드|새틴|프라다|샤넬|고급|시스루/i.test(t))tags.push('LUXURY');if(/파티|글램|스팽글|오프숄더|코르셋|홀터|튜브탑/i.test(t))tags.push('PARTY');if(/추천|강추/i.test(t))tags.push('RECOMMEND');tags.push(categoryOf(p));return [...new Set(tags)]}function displayName(p){return clean(p.name).replace(/아이보리보리/g,'아이보리').replace(/스림/g,'슬림').replace(/얀간/g,'약간')}function salesPoints(p){let pts=p.points&&p.points.length?p.points.slice(0,3):[];const n=displayName(p);if(pts.length<3&&/오프숄더/.test(n))pts.push('어깨선과 쇄골 라인을 살려 상체가 여리해 보이는 포인트');if(pts.length<3&&/투피스/.test(n))pts.push('상·하 세트 구성이라 코디 고민 없이 바로 완성되는 룩');if(pts.length<3&&/롱|미디/.test(n))pts.push('기장감이 있어 고급스럽고 차분한 분위기까지 살릴 수 있는 디자인');if(pts.length<3)pts.push('조명 아래에서 실루엣이 살아나는 파티·방송·촬영 추천 스타일');return [...new Set(pts)].slice(0,3)}function track(type,code){const k='nice_stat_'+type+'_'+(code||'all');localStorage.setItem(k,(Number(localStorage.getItem(k)||0)+1));}async function load(){PRODUCTS=await(await fetch('./products.json')).json();makeChips();render();initHistory();if(location.hash==='#admin')showAdmin()}function makeChips(){chips.innerHTML=cats.map(([k,v])=>`<button class="chip ${k==='ALL'?'on':''}" data-k="${k}" onclick="currentCat='${k}';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');render()">${v}</button>`).join('')}function quick(k){currentCat=k;setTimeout(()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.k===k));render()},50)}function match(p){const q=document.getElementById('q').value.trim().toLowerCase();const text=[displayName(p),categoryOf(p),p.color,p.code,p.origin,p.desc,(p.points||[]).join(' '),tagsOf(p).join(' ')].join(' ').toLowerCase();return(!q||text.includes(q))&&(currentCat==='ALL'||tagsOf(p).includes(currentCat))}function render(){const list=PRODUCTS.filter(match);count.innerHTML=`${list.length} items<br>${currentCat==='ALL'?'전체 상품':currentCat+' 컬렉션'}`;grid.innerHTML=list.map(p=>{const tags=tagsOf(p);const cat=categoryOf(p);return `<article class="card" onclick="openDetail('${p.code}')"><div class="photo">${p.images&&p.images[0]?`<img loading="lazy" decoding="async" src="${p.images[0]}" alt="${displayName(p)}">`:`<div class="empty">IMAGE<br>COMING SOON</div>`}${tags.includes('BEST')?'<span class="badge">BEST</span>':''}${tags.includes('NEW')?'<span class="badge new">NEW</span>':''}<span class="price-pill">${money(p.price)}</span></div><div class="info"><div class="name">${displayName(p)}</div><div class="meta"><span>${cat}</span>${p.color?`<span>${clean(p.color).replace(/아이보리보리/g,'아이보리')}</span>`:''}</div></div></article>`}).join('')}function setMainImage(i){const main=document.getElementById('mainProductImage');if(!main||!currentImages[i])return;main.src=currentImages[i];document.querySelectorAll('.thumb').forEach((t,idx)=>t.classList.toggle('on',idx===i));}function openDetail(code,push=true){const p=PRODUCTS.find(x=>x.code===code);if(!p)return;track('view',code);if(push){if(!history.state||(!history.state.niceHome&&!history.state.niceModal)){history.replaceState({niceHome:true},'', location.pathname+location.search);}history.pushState({niceModal:code},'', location.pathname+location.search+'#product-'+code);}const imgs=p.images||[];currentImages=imgs;const cat=categoryOf(p);const thumbs=imgs.length>1?`<div class="thumbs">${imgs.map((src,i)=>`<button class="thumb ${i===0?'on':''}" onclick="setMainImage(${i})"><img src="${src}" alt="${displayName(p)} ${i+1}"></button>`).join('')}</div>`:'';const pointList=salesPoints(p).map(x=>`<li>${x}</li>`).join('');panel.innerHTML=`<div class="topbar"><button class="close" onclick="closeDetail()">✕</button><span>${p.code} · ${cat}</span></div><div class="detail-body"><div class="gallery"><div class="main-img">${imgs[0]?`<img id="mainProductImage" src="${imgs[0]}" alt="${displayName(p)}">`:'<div class="empty">IMAGE COMING SOON</div>'}</div>${thumbs}</div><div class="dinfo"><div class="dcat">${tagsOf(p).filter(x=>!['MINI','MIDI','LONG','TOP','SKIRT','TWO PIECE'].includes(x)).join(' · ')||cat}</div><div class="dname">${displayName(p)}</div><div class="dprice">${money(p.price)}</div><div class="pointbox"><div class="point-title">이 옷의 포인트</div><ul class="points">${pointList}</ul></div><div class="recommend">${p.recommend||'추천 상황: 클럽 · 파티 · 방송 · 촬영 · 행사룩'}</div><div class="specs"><div class="spec"><b>COLOR</b>${clean(p.color).replace(/아이보리보리/g,'아이보리')||'-'}</div><div class="spec"><b>SIZE</b>${p.size||'S / M / L'}</div><div class="spec"><b>FIT</b>${p.stretch||'-'}</div><div class="spec"><b>SEE THROUGH</b>${p.see||'-'}</div><div class="spec soft"><b>FABRIC</b>${p.fabric||'-'}</div><div class="spec soft"><b>LINING</b>${p.lining||'-'}</div></div><div class="cta"><a class="kakao" href="${KAKAO_URL}" target="_blank" onclick="track('kakao','${p.code}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4C6.48 4 2 7.42 2 11.65c0 2.67 1.78 5.02 4.47 6.39l-.72 2.64c-.08.28.24.5.48.34l3.14-2.08c.84.18 1.72.27 2.63.27 5.52 0 10-3.42 10-7.56S17.52 4 12 4Z"/></svg>카카오톡 문의</a><a class="insta" href="${INSTAGRAM_URL}" target="_blank" onclick="track('instagram','${p.code}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>Instagram DM</a><a class="store" href="#" onclick="track('store','${p.code}');alert('스마트스토어 연결 예정입니다')">스마트스토어 준비중</a></div></div></div>`;detail.classList.add('open');document.body.style.overflow='hidden';modalOpen=true}
function closeDetail(fromPop=false){if(!fromPop&&modalOpen&&history.state&&history.state.niceModal){history.back();return}detail.classList.remove('open');document.body.style.overflow='';modalOpen=false}
function initHistory(){if(!history.state||(!history.state.niceHome&&!history.state.niceModal)){history.replaceState({niceHome:true},'',location.pathname+location.search)}if(location.hash.startsWith('#product-')){const code=location.hash.replace('#product-','');setTimeout(()=>openDetail(code,false),300)}}
window.addEventListener('popstate',e=>{if(modalOpen){closeDetail(true);history.replaceState({niceHome:true},'',location.pathname+location.search);return}if(e.state&&e.state.niceModal){openDetail(e.state.niceModal,false)}});function showAdmin(){let total=0;Object.keys(localStorage).forEach(k=>{if(k.startsWith('nice_stat_view_'))total+=Number(localStorage.getItem(k)||0)});adminBox.style.display='block';adminBox.innerHTML=`<b>관리자 로컬 통계</b><br>이 브라우저에서 기록된 상품 조회: ${total}회<br>정식 방문자 통계는 Google Analytics 연결 후 전체 방문자 기준으로 확인 가능`}load();
</script>
</body>
</html>
