<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NICE COLLECTION</title>
  <link rel="stylesheet" href="style.css?v=match46" />
</head>
<body>
  <header class="hero">
    <h1>NICE</h1>
    <p>Luxury Evening Edit</p>
  </header>

  <main class="wrap">
    <div class="top">
      <input id="q" class="search" placeholder="검색: 상품명, 컬러, 카테고리" />
      <div id="quick" class="quick"></div>
    </div>

    <div id="chips" class="chips"></div>

    <div class="head">
      <h2 id="title">NICE COLLECTION</h2>
      <div id="count" class="count"></div>
    </div>

    <p id="intro" class="intro"></p>
    <section id="grid" class="grid"></section>
  </main>

  <div id="modal" class="modal">
    <div class="panel">
      <div class="modal-top">
        <div class="brand">NICE COLLECTION</div>
        <button id="close" class="close" type="button">×</button>
      </div>
      <div id="detail"></div>
    </div>
  </div>

  <script src="app.js?v=match46"></script>

</html>
