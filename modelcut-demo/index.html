<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NICE 모델컷 multi-image 검토판</title>
<style>
:root{--ink:#181715;--muted:#746f68;--paper:#f3efe8;--card:#fffdf9;--line:#ded6ca;--accent:#304a40;--bad:#8e3c32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1560px;margin:auto;padding:42px 24px 80px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.12em}.head h1{font-size:clamp(34px,5vw,64px);line-height:1;margin:8px 0}.head p{max-width:820px;color:var(--muted);line-height:1.7}.button{border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.notice{margin:24px 0 30px;padding:15px 18px;border-left:4px solid var(--accent);background:#e7ece8;font-weight:700}.grid{display:grid;gap:24px}.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 8px 28px rgba(45,35,25,.05)}.card-head{display:flex;justify-content:space-between;gap:16px}.code{margin:0;color:var(--accent);font-weight:900}.card h2{margin:5px 0 0}.combo{color:var(--muted);font-weight:700}.status{height:max-content;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;font-weight:800}.comparison{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin:18px 0}.group{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#efe9e1}.group h3{margin:0;padding:10px 12px;background:#fff;font-size:14px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.gallery img,.empty{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e8e1d8}.empty{display:grid;place-items:center;color:var(--muted)}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.check{padding:10px;border:1px solid var(--line);border-radius:9px}.check span{display:block;color:var(--muted);font-size:12px}.check select{width:100%;border:0;background:transparent;font-size:20px;font-weight:900}.edit{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px}.edit label{color:var(--muted);font-size:12px}.edit textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}.approve{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--ink)!important;font-weight:800}.approve input{width:20px;height:20px}.analysis{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.analysis summary{cursor:pointer;font-weight:900}.analysis pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}.error{padding:20px;border:1px solid #d99;color:var(--bad);background:#fff}@media(max-width:900px){.comparison,.edit{grid-template-columns:1fr}.checks{grid-template-columns:repeat(3,1fr)}.head{align-items:start;flex-direction:column}.wrap{padding:28px 14px 52px}}
</style></head><body><main class="wrap"><section class="head"><div><p class="eyebrow">NICE · TEST DEPLOYMENT</p><h1 id="title">multi-image 검토판</h1><p>실제 상품 일치도를 우선하는 독립 테스트 페이지입니다. 여러 제품컷을 비교하고 상태와 재생성 메모를 저장할 수 있습니다.</p></div><div><button class="button" id="import">검토 상태 JSON 불러오기</button> <button class="button" id="export">검토 상태 JSON 내보내기</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></section><div class="notice" id="notice">데이터를 불러오는 중입니다.</div><section class="grid" id="grid"></section></main>
<script>
const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const key="nice-modelcut-review-v1";const states=JSON.parse(localStorage.getItem(key)||"{}");const scoreFields=["colorMatch","lengthMatch","detailMatch","fabricMatch","silhouetteMatch"];
const gallery=(label,images)=>`<section class="group"><h3>${e(label)} · ${images.length}장</h3><div class="gallery">${images.filter(Boolean).map(src=>`<img src="${e(src)}" alt="${e(label)}" loading="lazy">`).join("")||'<div class="empty">이미지 연결 대기</div>'}</div></section>`;const opts=(values,selected)=>values.map(v=>`<option${v===selected?" selected":""}>${e(v||"-")}</option>`).join("");
function render(item){const state={...item,...states[item.candidateId],scores:{...item.scores,...(states[item.candidateId]?.scores||{})}};const checks=scoreFields.map(field=>`<label class="check"><span>${({colorMatch:"컬러",lengthMatch:"기장",detailMatch:"디테일",fabricMatch:"원단",silhouetteMatch:"실루엣"})[field]}</span><select data-score="${field}">${opts(["O","△","X",""],state.scores[field])}</select></label>`).join("");return `<article class="card" data-id="${e(item.candidateId)}"><div class="card-head"><div><p class="code">${e(item.candidateId)}</p><h2>${e(item.topName)} + ${e(item.bottomName)}</h2><p class="combo">${e(item.topCode)} · ${e(item.topColor)} / ${e(item.bottomCode)} · ${e(item.bottomColor)}</p></div><select name="status" class="status">${opts(["승인","조건부 승인","보류","재생성","reference 재선정","반려","제외"],state.status)}</select></div><div class="comparison">${gallery("실제 상의",item.topImages)}${gallery("실제 하의",item.bottomImages)}${gallery("생성 모델컷",item.candidateImage?[item.candidateImage]:[])}</div><div class="checks">${checks}</div><div class="edit"><label>검토 메모<textarea name="memo" rows="3">${e(state.memo)}</textarea></label><label>재생성 메모<textarea name="regenerationMemo" rows="3">${e(state.regenerationMemo)}</textarea></label><label class="approve"><input type="checkbox" name="approved"${state.approved?" checked":""}> 최종 승인</label></div><details class="analysis"><summary>Step 2 상품 분석</summary><pre>${e(JSON.stringify(item.analysis,null,2))}</pre></details></article>`}
function enforce(card,scores){const pass=Object.values(scores).filter(v=>v==="O").length;const hard=["colorMatch","lengthMatch","detailMatch","silhouetteMatch"].some(k=>scores[k]==="X");const approved=card.querySelector('[name="approved"]');approved.disabled=hard||pass<3;if(approved.disabled)approved.checked=false;const status=card.querySelector('[name="status"]');if(status.value==="승인"&&(hard||pass<4))status.value=hard?"반려":"보류";if(status.value==="조건부 승인"&&(hard||pass<3))status.value=hard?"반려":"보류"}
function save(){document.querySelectorAll(".card").forEach(card=>{const scores={};card.querySelectorAll("[data-score]").forEach(x=>scores[x.dataset.score]=x.value);enforce(card,scores);states[card.dataset.id]={status:card.querySelector('[name="status"]').value,approved:card.querySelector('[name="approved"]').checked,memo:card.querySelector('[name="memo"]').value,regenerationMemo:card.querySelector('[name="regenerationMemo"]').value,scores}});localStorage.setItem(key,JSON.stringify(states))}
fetch("data/review_items.json").then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{document.getElementById("title").textContent=data.title;document.getElementById("notice").textContent=`${data.notice} · 후보 ${data.items.length}건 · 4/5 O 승인, 3/5 O + hard fail 없음 조건부 승인`;document.getElementById("grid").innerHTML=data.items.map(render).join("");document.querySelectorAll(".card").forEach(card=>{const scores={};card.querySelectorAll("[data-score]").forEach(x=>scores[x.dataset.score]=x.value);enforce(card,scores)});document.getElementById("grid").addEventListener("change",save);document.getElementById("grid").addEventListener("input",save)}).catch(error=>document.getElementById("grid").innerHTML=`<div class="error">README의 HTTP 서버 명령으로 열어 주세요. (${e(error.message)})</div>`);
document.getElementById("export").addEventListener("click",()=>{save();const blob=new Blob([JSON.stringify({schemaVersion:1,items:states},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="modelcut_review_state.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
document.getElementById("import").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(!payload||payload.schemaVersion!==1||!payload.items||Array.isArray(payload.items)||typeof payload.items!=="object")throw Error("지원하지 않는 검토 상태 형식입니다.");Object.keys(states).forEach(id=>delete states[id]);Object.assign(states,payload.items);localStorage.setItem(key,JSON.stringify(states));location.reload()}catch(error){alert(`JSON 불러오기 실패: ${error.message}`)}finally{event.target.value=""}});
</script></body></html>
