<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NICE 모델컷 저장 작업 검토판</title>
  <style>
    :root{--ink:#181715;--muted:#746f68;--paper:#f3efe8;--card:#fffdf9;--line:#ded6ca;--accent:#304a40;--bad:#8e3c32;--user:#79552d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1560px;margin:auto;padding:42px 24px 80px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.12em}.head h1{font-size:clamp(34px,5vw,64px);line-height:1;margin:8px 0}.head p{max-width:820px;color:var(--muted);line-height:1.7}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.button{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.notice{margin:24px 0 30px;padding:15px 18px;border-left:4px solid var(--accent);background:#e7ece8;font-weight:700}.grid{display:grid;gap:24px}.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 8px 28px rgba(45,35,25,.05)}.card.user-card{border-color:#cbb89e}.card-head{display:flex;justify-content:space-between;gap:16px}.code{margin:0;color:var(--accent);font-weight:900}.card h2{margin:5px 0 0}.combo{color:var(--muted);font-weight:700}.source{display:inline-block;margin-left:7px;border-radius:999px;padding:3px 7px;background:#eee5d9;color:var(--user);font-size:11px}.status{height:max-content;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;font-weight:800}.comparison{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:14px;margin:18px 0}.group{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#efe9e1}.group h3{margin:0;padding:10px 12px;background:#fff;font-size:14px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.gallery img,.image-empty{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e8e1d8}.image-empty{display:grid;place-items:center;color:var(--muted)}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.check{padding:10px;border:1px solid var(--line);border-radius:9px}.check span{display:block;color:var(--muted);font-size:12px}.check select{width:100%;border:0;background:transparent;font-size:20px;font-weight:900}.edit{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px}.edit label{color:var(--muted);font-size:12px}.edit textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}.approve{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;color:var(--ink)!important;font-weight:800}.approve input{width:20px;height:20px}.analysis{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.analysis summary{cursor:pointer;font-weight:900}.analysis-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0 0;padding:0;list-style:none}.analysis-list li{padding:9px;border-radius:8px;background:#f4f0ea;color:var(--muted);font-size:12px}.prompt-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;padding:12px;border-radius:9px;background:#f4f0ea;color:var(--muted)}.board-empty{padding:70px 20px;border:1px dashed var(--line);border-radius:18px;background:var(--card);text-align:center}.board-empty h2{margin:0 0 8px}.board-empty p{color:var(--muted);line-height:1.7}.error{padding:20px;border:1px solid #d99;color:var(--bad);background:#fff}@media(max-width:900px){.comparison,.edit{grid-template-columns:1fr}.checks{grid-template-columns:repeat(3,1fr)}.analysis-list{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.toolbar{justify-content:flex-start}.wrap{padding:28px 14px 52px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="head">
      <div><p class="eyebrow">NICE · SAVED JOBS</p><h1 id="title">저장 작업 검토판</h1><p>관리자 화면에서 직접 만든 작업만 먼저 표시합니다. 테스트 샘플은 필요할 때만 불러오세요.</p></div>
      <div class="toolbar"><a class="button" href="admin.html">+ 새 작업 만들기</a><button class="button secondary" id="toggleSamples">샘플 데이터 불러오기</button><button class="button secondary" id="import">검토 상태 JSON 불러오기</button><button class="button secondary" id="export">검토 상태 JSON 내보내기</button><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    </section>
    <div class="notice" id="notice">데이터를 불러오는 중입니다.</div>
    <section class="grid" id="grid"></section>
  </main>
  <script src="job-store.js"></script>
  <script src="review.js"></script>
</body>
</html>
