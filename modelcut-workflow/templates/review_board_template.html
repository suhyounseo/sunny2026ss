<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NICE 모델컷 검토판</title>
  <style>
    :root{--ink:#191816;--muted:#726d66;--line:#ddd7cf;--paper:#f4f1ec;--card:#fff;--accent:#274a3e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{max-width:1480px;margin:auto;padding:52px 28px 80px}.eyebrow{margin:0;color:var(--accent);font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(34px,5vw,68px);line-height:1;margin:12px 0 16px}.hero>p:last-child{max-width:760px;color:var(--muted);font-size:17px;line-height:1.7}.notice{margin:28px 0 38px;padding:16px 20px;border-left:4px solid var(--accent);background:#e8eee9;font-weight:700}.grid{display:grid;gap:24px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(30,25,20,.05)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}header p{margin:0 0 5px;color:var(--accent);font-weight:900;letter-spacing:.08em}h2{margin:0;font-size:27px}.status{border:1px solid #b7c7bc;border-radius:999px;padding:8px 12px;background:#edf3ee;color:#23483a;font-weight:800;white-space:nowrap}.combo{color:var(--muted);font-weight:700}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}figure{min-width:0;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#eee}figure img,figure>div{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.placeholder>div{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:repeating-linear-gradient(135deg,#f3f0eb,#f3f0eb 12px,#eae6df 12px,#eae6df 24px);font-weight:900;text-align:center}.placeholder small{display:block;max-width:100%;margin-top:10px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}.placeholder div,figcaption{overflow-wrap:anywhere}figcaption{padding:10px 12px;background:#fff;font-size:13px;font-weight:800}.review{display:flex;gap:20px;align-items:stretch}.review ul{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:8px;list-style:none;margin:0;padding:0;flex:1}.review li{padding:11px;border:1px solid var(--line);border-radius:10px}.review li span{display:block;color:var(--muted);font-size:12px}.review li b{font-size:20px}.score{min-width:110px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--ink);color:#fff}.score span{font-size:12px}.score strong{font-size:28px}.score small{font-size:12px}.memo{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);color:#4e4943;line-height:1.6}@media(max-width:820px){.images{grid-template-columns:1fr}.review{display:block}.review ul{grid-template-columns:repeat(3,minmax(0,1fr))}.score{margin-top:10px}.wrap{padding:30px 16px 60px}}
  </style>
</head>
<body><main class="wrap"><section class="hero"><p class="eyebrow">NICE · PRODUCT ACCURACY REVIEW</p><h1>모델컷 검토판</h1><p>실제 상의와 하의, 생성 후보, 품질 판정을 한 화면에서 비교합니다. 분위기보다 상품 일치도를 우선합니다.</p></section><div class="notice">승인 후보는 쇼룸 반영 승인이 아닙니다. products.json과 운영 쇼룸은 별도 명시적 승인 전까지 수정하지 않습니다.</div><section class="grid">{{CARDS}}</section></main></body>
</html>
